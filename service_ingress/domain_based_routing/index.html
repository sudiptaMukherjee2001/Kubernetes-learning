<!DOCTYPE html>
<html>
<head>
  <title>K8s DR Demo</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>Kubernetes DR Demo App-secondary</h2>

  <form id="myForm">
    <input type="text" id="name" placeholder="Enter your name" required />
    <br/>
    <button type="submit">Submit</button>
  </form>

  <div id="status"></div>

  <script>
    const form = document.getElementById("myForm");
    const statusDiv = document.getElementById("status");

    async function submitData(retry = false) {
      const name = document.getElementById("name").value;

      try {
        statusDiv.innerText = retry 
          ? "Retrying request..." 
          : "Submitting...";

        const res = await fetch("/api/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name })
        });

        if (!res.ok) throw new Error("Request failed");

        const data = await res.text();

        statusDiv.innerText = "✅ Success: " + data;

      } catch (err) {
        statusDiv.innerText = "⚠️ Service unavailable. Retrying...";

        // retry after 3 seconds
        setTimeout(() => submitData(true), 3000);
      }
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      submitData();
    });
  </script>

</body>
</html>
