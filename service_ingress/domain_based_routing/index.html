<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s DR Demo</title>
    <style>
        /* Modern CSS Variables for a Custom Feel */
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --error: #dc2626;
            --success: #059669;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 480px;
            padding: 48px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 12px;
        }

        /* Form Controls */
        #myForm {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        /* Status Feedback Area */
        #status {
            margin-top: 32px;
            min-height: 60px;
            font-size: 1rem;
            padding: 16px;
            border-radius: 12px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .status-idle { opacity: 0; }

        .status-loading {
            background: #f8fafc;
            color: var(--text-muted);
            border: 1px solid var(--border);
            animation: pulse 1.5s infinite ease-in-out;
        }

        .status-success {
            background: #f0fdf4;
            color: var(--success);
            border: 1px solid #bbf7d0;
            font-weight: 600;
        }

        .status-error {
            background: #fef2f2;
            color: var(--error);
            border: 1px solid #fecaca;
            font-weight: 600;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>K8s DR Demo App</h2>
            <p class="subtitle">Submit data to verify cluster availability.</p>
        </div>

        <form id="myForm">
            <input type="text" id="name" placeholder="Enter record name" required autocomplete="off" />
            <button type="submit" id="submitBtn">Submit Data</button>
        </form>

        <div id="status" class="status-idle"></div>
    </div>

    <script>
        const form = document.getElementById("myForm");
        const statusDiv = document.getElementById("status");
        const submitBtn = document.getElementById("submitBtn");
        const nameInput = document.getElementById("name");

        async function submitData(retry = false) {
            const name = nameInput.value;

            // UI Update: Disable button and show loading state
            submitBtn.disabled = true;
            statusDiv.className = "status-loading";
            statusDiv.innerHTML = retry
                ? "Connection lost. Re-attempting sync..."
                : "Processing request...";

            try {
                const res = await fetch("/api/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name })
                });

                if (!res.ok) throw new Error("Server Unreachable");

                const data = await res.text();

                // On Success
                statusDiv.className = "status-success";
                statusDiv.innerHTML = `✅ Successfully recorded: ${data}`;
                submitBtn.disabled = false;

            } catch (err) {
                // On Failure: Trigger the retry loop
                statusDiv.className = "status-error";
                statusDiv.innerHTML = "⚠️ Service unreachable. failover in progress...";

                // Delay 3 seconds then try again
                setTimeout(() => submitData(true), 3000);
            }
        }

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            submitData();
        });
    </script>

</body>
</html>
