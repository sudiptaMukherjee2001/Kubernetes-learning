<!DOCTYPE html>
<html>
<head>
  <title>Report System Demo-secondary</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      text-align: center;
      padding: 40px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 400px;
      margin: auto;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .primary { background: #007bff; color: white; }
    .danger { background: #dc3545; color: white; }

    select, input {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    #responseTime {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Report Generator-secondary</h2>

    <!-- Report Type -->
    <select id="reportType">
      <option value="sales">Sales Report</option>
      <option value="users">User Report</option>
      <option value="orders">Orders Report</option>
    </select>

    <!-- Report Size -->
    <select id="reportSize">
      <option value="small">Small (Fast)</option>
      <option value="large">Large (Heavy)</option>
    </select>

    <!-- Action -->
    <button class="primary" onclick="generateReport()">
      Generate Report
    </button>

    <!-- Status -->
    <div id="status">Status: Idle</div>
    <div id="responseTime"></div>
  </div>

<script>
async function generateReport() {
  const type = document.getElementById("reportType").value;
  const size = document.getElementById("reportSize").value;
  const statusEl = document.getElementById("status");
  const timeEl = document.getElementById("responseTime");

  try {
    statusEl.innerText = "Processing...";
    timeEl.innerText = "";

    const start = Date.now();

    let res;

    if (size === "small") {
      // Fast path (precomputed)
      res = await fetch("/api/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ name: type })
      });
    } else {
      // Heavy path (CPU block)
      res = await fetch("/api/block");
    }

    const end = Date.now();
    const time = end - start;

    if (!res.ok) {
      throw new Error("Service unavailable");
    }

    const data = await res.text();

    statusEl.innerText = data;
    timeEl.innerText = "Response time: " + time + " ms";

  } catch (err) {
    statusEl.innerText = "Service temporarily unavailable";
    timeEl.innerText = "Try again in a few seconds...";
  }
}
</script>

</body>
</html>
