apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: k8-learning-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: k8-learing-journey-app-deployment

  minReplicas: 1
  maxReplicas: 3

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 10
