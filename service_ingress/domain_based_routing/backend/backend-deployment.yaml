apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: sudipta4docker/domain-based-routing-backend:v1.0.13
        ports:
        - containerPort: 80

        # ✅ Readiness Probe (traffic control)
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

        # ✅ Liveness Probe (auto-restart)
        livenessProbe:
          httpGet:
            path: /live
            port: 80
          initialDelaySeconds: 180
          periodSeconds: 10
          failureThreshold: 3
